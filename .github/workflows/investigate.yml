name: investigate
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: monthly run whose chunks to analyse
        default: "36784389523"
permissions:
  contents: write
  actions: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy pyarrow requests tabulate ppc-forecaster
      - uses: actions/download-artifact@v4
        with:
          path: chunks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python investigate.py --chunks ../chunks --out ../results/INVESTIGATE.md
        working-directory: backfill
      - name: publish
        run: |
          cat results/INVESTIGATE.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/INVESTIGATE.md
          git commit -q -m "investigation $(date -u +%F)" && git pull -q --rebase && git push -q || true
