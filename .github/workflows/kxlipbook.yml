name: kxlipbook
# Backup recorder for the Kalshi NFL LIP forward test (results/PLAN_NFL_LIP_VALIDATE.md, slate 16-20 Oct) while the
# laptop is closed. Runs live/kxlipbook.py (GET-only public Kalshi API, no keys, no orders) in ~5.4 h runs chained
# back to back, inside a fixed window only; each run's output is uploaded as a 14-day artifact (not committed).
# Primary data source is the Predexon backfill; this is the cross-check / fallback.
on:
  schedule:
    - cron: "17 * * * *"          # restarter if the chain breaks (GitHub may delay these by hours); exits at once outside the window
  workflow_dispatch:
    inputs:
      test_seconds:
        description: "smoke test: record this many seconds now, ignore the window, do not chain"
        required: false
        default: ""
permissions:
  contents: read
  actions: write
concurrency:
  group: kxlipbook
  cancel-in-progress: false
env:
  WIN_START: "2026-10-15T20:00:00Z"
  WIN_END: "2026-10-20T04:00:00Z"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: window check
        id: win
        run: |
          now=$(date -u +%s); a=$(date -u -d "$WIN_START" +%s); b=$(date -u -d "$WIN_END" +%s)
          if [ -n "${{ inputs.test_seconds }}" ]; then echo "secs=${{ inputs.test_seconds }}" >> "$GITHUB_OUTPUT"; echo "in=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$now" -ge "$a" ] && [ "$now" -lt "$b" ]; then
            echo "secs=$(( b - now < 325*60 ? b - now : 325*60 ))" >> "$GITHUB_OUTPUT"; echo "in=1" >> "$GITHUB_OUTPUT"
          else echo "in=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.win.outputs.in == '1'
        with:
          sparse-checkout: live/kxlipbook.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        if: steps.win.outputs.in == '1'
        with:
          python-version: "3.12"
      - name: record
        if: steps.win.outputs.in == '1'
        run: |
          pip install -q requests
          mkdir -p out
          python -u live/kxlipbook.py --root out/kxlipbook --log out/kxlipbook.log --max-seconds ${{ steps.win.outputs.secs }} || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.win.outputs.in == '1'
        with:
          name: kxlipbook-${{ github.run_id }}
          path: out
          retention-days: 14
      - name: start the next run
        if: always() && steps.win.outputs.in == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); b=$(date -u -d "$WIN_END" +%s)
          if [ -z "${{ inputs.test_seconds }}" ] && [ $(( b - now )) -gt 300 ]; then gh workflow run kxlipbook.yml --ref main -R "$GITHUB_REPOSITORY"; fi
