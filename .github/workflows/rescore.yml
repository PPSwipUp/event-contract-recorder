name: rescore
# Re-score already-collected chunks with the current code (no re-collection).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: run whose artifacts to score
      kind:
        description: holdout or database
        default: holdout
permissions:
  contents: write
  actions: read
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        s:
          - {series: KXETH, product: ETH-USD}
          - {series: KXETHD, product: ETH-USD}
          - {series: KXBTC, product: BTC-USD}
          - {series: KXBTCD, product: BTC-USD}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy pyarrow requests tabulate ppc-forecaster
      - uses: actions/download-artifact@v4
        if: ${{ inputs.kind == 'holdout' && matrix.s.series == 'KXETH' }}
        with:
          path: chunks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.kind == 'database' }}
        with:
          pattern: db-${{ matrix.s.series }}-*
          path: chunks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: score
        working-directory: backfill
        run: |
          if [ "${{ inputs.kind }}" = holdout ]; then
            [ "${{ matrix.s.series }}" = KXETH ] && python tradebt.py evaluate --chunks ../chunks --out ../new/HOLDOUT_JAN_JUL.md || true
          else
            python db.py evaluate --series ${{ matrix.s.series }} --product ${{ matrix.s.product }} --chunks ../chunks --out ../new/DB_${{ matrix.s.series }}.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.s.series }}
          path: new/*.md
          if-no-files-found: ignore
  publish:
    needs: rescore
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: res
          merge-multiple: true
      - run: |
          ls -R res | head
          git pull -q --rebase
          cp res/*.md results/ 2>/dev/null || true
          git status --short
          rm -rf res
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -q -m "rescored ${{ inputs.kind }} $(date -u +%F)" && git push -q || echo "nothing new"
