name: compact
# daily: pack every finished day into a release asset (data-YYYY-MM-DD.tar), then reset the data branch
# to just today's files so the repository never grows
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1
      - name: pack finished days into releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          days=$( (ls -d */????-??-?? 2>/dev/null | xargs -n1 basename; ls log 2>/dev/null | sed 's/\.log$//') | sort -u | awk -v t="$today" '$0 < t')
          for d in $days; do
            tar cf "data-$d.tar" $(ls -d */"$d" log/"$d".log 2>/dev/null)
            gh release view "data-$d" >/dev/null 2>&1 || gh release create "data-$d" --title "data $d" --notes "Recorded prices for $d (UTC)" --target main
            gh release upload "data-$d" "data-$d.tar" --clobber
            rm -rf */"$d" log/"$d".log "data-$d.tar"
          done
      - name: reset data branch to what is left
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "compacted $(date -u +%F)"
          git push -q -f origin fresh:data
