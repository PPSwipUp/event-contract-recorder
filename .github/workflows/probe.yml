name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=https://api.elections.kalshi.com/trade-api/v2
          E=KXBTC-26SEP3012; c=$(date -d 2026-09-30T16:00:00Z +%s)
          curl -s "$K/series/KXBTC/events/$E/candlesticks?period_interval=1&start_ts=$((c-3900))&end_ts=$((c-3500))" | python3 -c "
          import json,sys;d=json.load(sys.stdin);t=d['market_tickers'];c=d['market_candlesticks']
          print(len(t), sum(1 for x in c if x));i=next(i for i,x in enumerate(c) if x);print(t[i], json.dumps(c[i][0])[:500])"
          curl -s "$K/series/KXBTC/events/$E/candlesticks?period_interval=60&start_ts=$((c-7200))&end_ts=$c" | python3 -c "
          import json,sys;d=json.load(sys.stdin);c=d['market_candlesticks'];print('p60 nonempty',sum(1 for x in c if x), [len(x) for x in c][:10])"
          H=$(curl -s "$K/historical/markets?series_ticker=KXBTC&limit=1&max_close_ts=1751328000" | tee h.json | python3 -c "import json,sys;m=json.load(sys.stdin)['markets'][0];print(m['ticker'], m['close_time'], m['event_ticker'])")
          echo "hist $H"; T=${H%% *}; EV=${H##* }
          python3 -c "import json;m=json.load(open('h.json'))['markets'][0];print({k:m.get(k) for k in ['floor_strike','cap_strike','result','expiration_value','volume_fp']})"
          ct=$(python3 -c "import json,datetime;m=json.load(open('h.json'))['markets'][0];print(int(datetime.datetime.fromisoformat(m['close_time'].replace('Z','+00:00')).timestamp()))")
          for u in "historical/markets/$T/candlesticks" "series/KXBTC/markets/$T/candlesticks" "historical/series/KXBTC/events/$EV/candlesticks" "series/KXBTC/events/$EV/candlesticks"; do
            echo "== $u"; curl -s "$K/$u?period_interval=1&start_ts=$((ct-3900))&end_ts=$((ct-3500))" | head -c 400; echo; done
          curl -s "$K/historical/markets?series_ticker=KXBTC&limit=1&max_close_ts=1704067200" | head -c 300; echo
