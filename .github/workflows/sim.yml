name: sim
# Volume-checked full simulation on the database chunks (backfill/sim.py)
on:
  workflow_dispatch:
    inputs:
      run_id:
        default: "36857144628"
permissions:
  contents: write
  actions: read
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy pyarrow requests tabulate ppc-forecaster
      - uses: actions/download-artifact@v4
        with:
          pattern: db-*
          path: chunks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python sim.py --chunks ../chunks --out ../results/SIM.md
        working-directory: backfill
      - name: publish
        run: |
          cat results/SIM.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase
          git add results/SIM.md
          git commit -q -m "full simulation $(date -u +%F)" && git push -q
